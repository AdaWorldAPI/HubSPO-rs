[package]
name = "hubspo-store"
description = "Write lanes, the batch image, publish-one-Lance-version, the KV value store, association edge lanes and list masks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lance-graph-quack.workspace = true
lance-graph-mask-risc.workspace = true
lance-graph-contract.workspace = true

# One Lance version per published batch (D-STO-1, persistence half). Off by
# default: lance needs `protoc` to build, and only the `store-lance` CI job
# installs it.
lance = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }

[features]
lance = ["dep:lance", "dep:arrow", "dep:futures"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[[example]]
name = "probe_history"
required-features = ["lance"]
